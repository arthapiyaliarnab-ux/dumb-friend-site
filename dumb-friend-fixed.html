<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dumb Friend 🤖</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 18px; background: #151622; color: white; font-family: Arial, Helvetica, sans-serif; }
    .app { width: 100%; max-width: 520px; padding: 24px; border-radius: 18px; background: #25283b; box-shadow: 0 20px 50px #0005; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .subtitle { margin: 0 0 16px; color: #c2c5d9; }
    .chat { min-height: 260px; height: 340px; overflow-y: auto; padding: 14px; background: #131523; border: 1px solid #3c3e54; border-radius: 12px; }
    .bubble { padding: 11px 13px; margin-bottom: 10px; border-radius: 12px; max-width: 94%; white-space: pre-wrap; word-wrap: break-word; line-height: 1.35; }
    .bot { background: #343458; color: #f5edff; margin-right: auto; }
    .user { background: #22544b; margin-left: auto; }
    .controls { display: flex; gap: 10px; margin-top: 13px; }
    #message { flex: 1; min-width: 0; padding: 13px; border-radius: 9px; border: 2px solid transparent; background: white; font-size: 16px; color: #171717; }
    #message:focus { outline: none; border-color: #a994ff; }
    button { font: inherit; font-weight: bold; border: 0; border-radius: 9px; padding: 12px 17px; cursor: pointer; }
    #send { color: #161622; background: #c7b1ff; }
    #send:hover { background: #e0d1ff; }
    #restart { color: #e6e7ff; background: #444967; margin-top: 12px; }
    .status { margin-top: 12px; font-size: 12px; color: #a6abc3; }
  </style>
</head>
<body>
  <main class="app">
    <h1>🤖 Dumb Friend</h1>
    <p class="subtitle">hewo! the silly little bot is here</p>
    <div class="chat" id="chat" role="log" aria-live="polite">
      <div class="bubble bot">🤖 hewo!</div>
    </div>
    <div class="controls">
      <input id="message" type="text" placeholder="Type hello here..." aria-label="Message" autocomplete="off">
      <button id="send" type="button" onclick="sendMessage()">Send</button>
    </div>
    <button id="restart" type="button" onclick="restartChat()">Start over</button>
    <div class="status" id="status">Loading chat...</div>
  </main>
  <script>
    // No Python required. This is the browser version of the Programiz bot.
    let stage = 'greeting';
    const chat = document.getElementById('chat');
    const input = document.getElementById('message');
    const status = document.getElementById('status');

    function say(text, speaker) {
      const bubble = document.createElement('div');
      bubble.className = 'bubble ' + speaker;
      bubble.textContent = (speaker === 'bot' ? '🤖 ' : 'You: ') + text;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
    }

    function sendMessage() {
      const original = input.value.trim();
      if (original === '') {
        say('type something first! 😭', 'bot');
        input.focus();
        return;
      }
      const answer = original.toLowerCase();
      say(original, 'user');
      input.value = '';

      if (stage === 'greeting') {
        if (answer === 'hello' || answer === 'hello there') {
          say('hey i wanna ask a qustion!', 'bot');
          say('what is your age?:', 'bot');
          stage = 'age';
          input.placeholder = 'Type your age...';
        } else {
          say('say hello or hello there!', 'bot');
        }
      } else if (stage === 'age') {
        const age = Number(answer);
        if (!/^\d+$/.test(answer) || !Number.isInteger(age) || age > 120) {
          say('please type your age as a number!', 'bot');
        } else {
          say(age >= 18 ? 'you are a adult!' : 'you are not a adult', 'bot');
          say('say hello to talk again!', 'bot');
          stage = 'greeting';
          input.placeholder = 'Type hello here...';
        }
      }
      input.focus();
    }

    function restartChat() {
      stage = 'greeting';
      chat.innerHTML = '';
      input.value = '';
      input.placeholder = 'Type hello here...';
      say('hewo!', 'bot');
      input.focus();
    }

    input.addEventListener('keydown', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        sendMessage();
      }
    });
    status.textContent = 'Bot is ready ✓  •  Click Send or press Enter';
  </script>
</body>
</html>
